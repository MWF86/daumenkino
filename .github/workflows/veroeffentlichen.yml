name: Veröffentlichen

# Ein Tag genügt. Danach baut GitHub beide Fassungen für macOS und Windows
# und hängt sie an eine Version im Reiter "Releases". Die ausgelieferten
# Programme holen sich die neue Fassung von dort selbst ab.
#
#     npm version patch        (oder minor / major)
#     git push --follow-tags
#
# Wer nur schauen will, ob der Bau durchläuft, startet den Lauf von Hand
# über "Actions" -> "Veröffentlichen" -> "Run workflow".

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Das Release einmal vorab anlegen. Sonst legen der Mac- und der
  # Windows-Lauf beim gleichzeitigen ersten Hochladen je ein eigenes
  # Release zum selben Tag an, und die Dateien verteilen sich auf zwei.
  release_anlegen:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Release anlegen, falls es fehlt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "${TAG#v}" --notes ""

  bauen:
    needs: release_anlegen
    if: always() && (needs.release_anlegen.result == 'success' || needs.release_anlegen.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        include:
          - betriebssystem: macos-latest
            ziel: mac
          - betriebssystem: windows-latest
            ziel: win
    runs-on: ${{ matrix.betriebssystem }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Abhängigkeiten holen
        run: npm ci

      # Die Apple-Werte kommen aus den Repository-Secrets. Fehlen sie,
      # baut der Lauf unsigniert weiter wie bisher.
      - name: Neutrale Fassung
        run: node bauen.js neutral ${{ matrix.ziel }} --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
